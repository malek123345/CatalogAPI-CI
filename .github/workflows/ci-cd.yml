name: CI/CD Pipeline - ProductCatalog API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ProductCatalog.Api/ProductCatalog.Api.csproj

      - name: Build solution
        run: dotnet build src/ProductCatalog.Api/ProductCatalog.Api.csproj --configuration Release --no-restore

      - name: Run Unit Tests
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductUnitTests"
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=UnitResults.trx"
          --results-directory ./TestResults/UnitTests

      - name: Upload Unit Tests Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: ./TestResults/UnitTests/*.trx

      - name: Publish Test Summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Report - Tests'
          path: './TestResults/**/*.trx'
          reporter: 'dotnet-trx'

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: [unit-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraire les métadonnées (Tags et Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/productcatalog-api
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
